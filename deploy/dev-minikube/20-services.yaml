# TEST-ONLY: the 7 Python services. Images are built into minikube by run.sh (hrc/<name>:dev).
#
# THE MONITORING CONTRACT: every pod below has
#   - the pod label    monitoring: hrc
#   - a container port named  metrics  (the /metrics page)
# Any deployment with those two things can be picked up by the monitoring stack.
#
# NOTE: no HTTP health probes on port 8080 on purpose: these services treat ANY request there as a
# message (e.g. a GET makes the ambulance agent publish to Kafka), so probes just check the port is open.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allocation-coordinator
  namespace: hrc
  labels: {app: allocation-coordinator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: allocation-coordinator}
  template:
    metadata:
      labels:
        app: allocation-coordinator
        monitoring: hrc
    spec:
      enableServiceLinks: false
      containers:
        - name: allocation-coordinator
          image: hrc/allocation-coordinator:dev
          imagePullPolicy: Never      # image was built straight into minikube
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: 9100}
          env:
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 48Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: allocation-coordinator
  namespace: hrc
spec:
  selector: {app: allocation-coordinator}
  ports:
    - {name: http, port: 8080, targetPort: http}
