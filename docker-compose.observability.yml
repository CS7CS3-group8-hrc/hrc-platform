# Monitoring stack (Prometheus + Grafana + Kafka exporter). Run it TOGETHER with the agents:
#   docker compose -f docker-compose.agents.yml -f docker-compose.observability.yml up -d --build
# Grafana:    http://localhost:3001   (user "admin", password = GRAFANA_ADMIN_PASSWORD from your .env)
# Prometheus: http://localhost:9090   (Status -> Targets shows what is being monitored)
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus

  # Reads Kafka's own stats (topics, offsets, consumer lag) and exposes them to Prometheus.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    restart: on-failure   # exits if Kafka is not ready yet; Docker retries

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set - copy .env.example to .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

# Same shared network as docker-compose.agents.yml, so Prometheus can reach every service by name.
networks:
  default:
    name: hrc-net

volumes:
  prometheus-data:
  grafana-data:
