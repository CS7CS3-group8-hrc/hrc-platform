global:
  scrape_interval: 5s   # how often Prometheus visits each /metrics page (short, for demos)

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]

  # Everything else is listed in observability/prometheus/targets/*.yml.
  # To monitor a new service, add a file there. No change to this file is needed.
  - job_name: hrc
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.yml"]
