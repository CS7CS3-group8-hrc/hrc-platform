[project]
name = "hrc-simulator"
version = "0.1.0"
description = "External Systems Simulator (HIS, Ambulance Tracking, Travel-Time) for the Hospital Resource Coordination Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "aiokafka>=0.11",
    "httpx>=0.27",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # `ruff format` owns line length; long TODO docstrings are fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
